# PostgreSQL. Versions 8.2 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On OS X with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On OS X with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#

development:
<% if ENV['DATABASE_URL'] %>
  # Set by docker-compose.yml, pointing at its Postgres container (restored
  # from a production .dump — see RUNBOOK.md). Falls back to local MySQL
  # below when running natively without Docker.
  url: <%= ENV['DATABASE_URL'] %>
<% else %>
  adapter: mysql2
  database: pools_development
  username: root
  password:
  host: <%= ENV['DB_HOST'] || 'localhost' %>
<% end %>

test:
  adapter: mysql2
  database: pools_test
  username: root
  password: password
  host: <%= ENV['DB_HOST'] || 'localhost' %>
production:
  # Supplied by the host (Render/Fly both inject this when you attach a
  # Postgres database to the app) — nothing to fill in here.
  url: <%= ENV["DATABASE_URL"] %>
  encoding: unicode
  pool: 5
