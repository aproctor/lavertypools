# Render Blueprint — deploys the Dockerfile as a free web service with a
# free Postgres database attached. See RUNBOOK.md for the yearly
# spin-up/restore and teardown/backup steps (the free DB expires 30 days
# after it's created, which is the point: recreate it each year from your
# latest .dump backup rather than paying to keep it running).
services:
  - type: web
    name: lavertypools
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lavertypools-db
          property: connectionString

databases:
  - name: lavertypools-db
    plan: free
    postgresMajorVersion: "13"
